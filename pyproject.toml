[build-system]
requires = ["setuptools", "cython"]
build-backend = "setuptools.build_meta"

[project]
name = "DplusPy"
version = "0.0.0"
authors = [
    {name = "Nicholas Collier", email = "niwicollier@gmail.com"}
]
description = "A package for studying evolution with a two-locus statistic"
requires-python = ">=3.11"
dependencies = [
    "numpy >= 1.26.4",
    "scipy >= 1.14.1",
    "moments-popgen >= 1.2.2",
    "demes >= 0.2.3",
    "msprime >= 1.3.3",
    "matplotlib >= 3.9.2",
    "bokeh >= 3.6.2",
    "pandas >= 2.2.3"
]

[tool.setuptools]
packages = ["dpluspy"]

